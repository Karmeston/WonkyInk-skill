name: Repair rainy campus gallery image

on:
  push:
    paths:
      - 'assets-base64/READY2'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild rainy campus PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/reference-gallery
          cat assets-base64/rainy-campus.part* | tr -d '\n' | base64 -d > examples/reference-gallery/rainy-campus.png
          rm -rf assets-base64
          rm -f .github/workflows/repair-rainy-gallery.yml

      - name: Commit repaired image
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: rebuild rainy campus reference image'
          git push
