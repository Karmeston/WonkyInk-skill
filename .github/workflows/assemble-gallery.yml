name: Assemble reference gallery images

on:
  push:
    paths:
      - 'assets-base64/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode gallery images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/reference-gallery
          cat assets-base64/rainy-campus.part* | tr -d '\n' | base64 -d > examples/reference-gallery/rainy-campus.jpg
          cat assets-base64/campus-trees.part* | tr -d '\n' | base64 -d > examples/reference-gallery/campus-trees.jpg
          rm -rf assets-base64
          rm -f .github/workflows/assemble-gallery.yml

      - name: Commit assembled images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: add reference gallery images'
          git push
